<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1612"/>
      <stop offset="100%" stop-color="#152c24"/>
    </linearGradient>
    <linearGradient id="goldD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#f7de8a"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#bgD)"/>
  <rect x="16" y="16" width="1168" height="408" rx="14" fill="none" stroke="url(#goldD)" stroke-width="2"/>

  <text x="600" y="58" text-anchor="middle" fill="url(#goldD)" font-family="Georgia, serif" font-size="28" font-weight="bold">
    HAYATIN İÇİNDE HAK İLE OLMAK: İKİ TEMEL GÖNÜL DÜSTURU
  </text>
  <line x1="220" y1="76" x2="980" y2="76" stroke="url(#goldD)" stroke-width="1"/>

  <!-- Left Card: Dustur 1 -->
  <g transform="translate(55, 100)">
    <rect width="520" height="295" rx="14" fill="#10241d" stroke="#d4af37" stroke-width="1.6"/>
    <rect x="24" y="22" width="180" height="28" rx="14" fill="#1b4d3e"/>
    <text x="114" y="41" text-anchor="middle" fill="#f7de8a" font-size="13" font-weight="bold">DÜSTUR 1 • ZÂHİR VE BÂTIN</text>
    <text x="24" y="84" fill="#f7de8a" font-family="Georgia, serif" font-size="24" font-weight="bold">
      "El kârda, gönül yârda"
    </text>
    <text x="24" y="110" fill="#d4af37" font-family="Georgia, serif" font-size="16" font-style="italic">
      Dest be-kâr, dil be-yâr (Halvet der-encümen)
    </text>
    <text x="24" y="146" fill="#e8e2d5" font-family="sans-serif" font-size="13.5">
      • Halk içinde Hak ile olmak; dünyadan kopmadan kalbi korumak.
    </text>
    <text x="24" y="174" fill="#e8e2d5" font-family="sans-serif" font-size="13.5">
      • Buhara çarşısında kumaş ölçüp biçerken kalbi bir saniye bile
    </text>
    <text x="36" y="196" fill="#e8e2d5" font-family="sans-serif" font-size="13.5">
      Allah'tan gafil olmayan genç tüccarın makamı.
    </text>
    <rect x="24" y="220" width="472" height="54" rx="8" fill="#0b1814" stroke="#d4af37" stroke-width="0.8"/>
    <text x="260" y="244" text-anchor="middle" fill="#f7de8a" font-family="Georgia, serif" font-size="13.5" font-style="italic">
      "30 yıldır insanlar benimle konuştuklarını sanırlar;
    </text>
    <text x="260" y="263" text-anchor="middle" fill="#f7de8a" font-family="Georgia, serif" font-size="13.5" font-style="italic">
      oysa ben Allah'tan başkasıyla konuşmadım." — Bâyezîd-i Bistâmî
    </text>
  </g>

  <!-- Right Card: Dustur 2 -->
  <g transform="translate(625, 100)">
    <rect width="520" height="295" rx="14" fill="#10241d" stroke="#d4af37" stroke-width="1.6"/>
    <rect x="24" y="22" width="195" height="28" rx="14" fill="#5a1220"/>
    <text x="121" y="41" text-anchor="middle" fill="#f7de8a" font-size="13" font-weight="bold">DÜSTUR 2 • MAHVİYET &amp; YOKLUK</text>
    <text x="24" y="84" fill="#f7de8a" font-family="Georgia, serif" font-size="22" font-weight="bold">
      "Eller yahşi ben yaman,
    </text>
    <text x="24" y="112" fill="#f7de8a" font-family="Georgia, serif" font-size="22" font-weight="bold">
      eller buğday ben saman"
    </text>
    <text x="24" y="146" fill="#e8e2d5" font-family="sans-serif" font-size="13.5">
      • Nefsi kınama (melâmet), kendini herkesten aşağı görme ve hiçlik.
    </text>
    <text x="24" y="174" fill="#e8e2d5" font-family="sans-serif" font-size="13.5">
      • Busra kervanında Rahip Bahîrâ'nın gölgelenen hurma ağacı altında
    </text>
    <text x="36" y="196" fill="#e8e2d5" font-family="sans-serif" font-size="13.5">
      gördüğü O Yetim'in (s.a.v.) kâinatın efendisi kılınması sırrı.
    </text>
    <rect x="24" y="220" width="472" height="54" rx="8" fill="#0b1814" stroke="#d4af37" stroke-width="0.8"/>
    <text x="260" y="244" text-anchor="middle" fill="#f7de8a" font-family="Georgia, serif" font-size="13.5" font-style="italic">
      "Bu kadar günahla ayakta duruyoruz,
    </text>
    <text x="260" y="263" text-anchor="middle" fill="#f7de8a" font-family="Georgia, serif" font-size="13.5" font-style="italic">
      bundan büyük keramet mi olur?" — Şah-ı Nakşibend (k.s.)
    </text>
  </g>
</svg>
